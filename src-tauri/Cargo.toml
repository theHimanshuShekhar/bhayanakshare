[package]
name = "bhayanakshare"
description = "BhayanakShare desktop shell: a thin Tauri layer over bhayanakshare-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bhayanakshare_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Start at login (autostart.rs). The Tauri plugin around it is not used: it cannot quote the program
# path the Windows Run key needs.
auto-launch = "0.6"
bhayanakshare-core = { path = "../crates/core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
# Needed by `generate_context!` once tauri.conf.json configures a plugin.
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
# The log subscriber (logging.rs); the files and the filter come from the core.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications. The Tauri plugin cannot report a click on a notification on the
# desktop, so Linux talks to the notification daemon directly, where a click can open an Offer.
notify-rust = "4"
# The version Tauri uses. Scanning a QR code needs the camera, which WebKitGTK keeps off.
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dev-dependencies]
# Reads back the Run key in the start at login test. The version auto-launch uses.
windows-registry = "0.6"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
