[package]
name = "bhayanakshare"
description = "BhayanakShare desktop shell: a thin Tauri layer over bhayanakshare-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bhayanakshare_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bhayanakshare-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"

# Desktop notifications. The Tauri plugin cannot report a click on a notification on the
# desktop, so Linux talks to the notification daemon directly, where a click can open an Offer.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
