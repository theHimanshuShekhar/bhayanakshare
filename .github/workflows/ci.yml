name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # What building the Tauri shell needs (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # BHAYANAKSHARE_REQUIRE_MULTICAST is left unset on purpose: multicast may not work on a
      # runner, and the LAN discovery tests then say so and skip instead of failing.
      - run: pnpm test
