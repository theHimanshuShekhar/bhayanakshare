[package]
name = "bhayanakshare-core"
description = "BhayanakShare core: Device API, control protocol, stores and persistence. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tests that run a relay server of their own, which most builds have no use for. Run one with
# `cargo test -p bhayanakshare-core --features relay-tests --test relay_limit`.
relay-tests = ["dep:iroh-relay"]

[[test]]
name = "relay_limit"
required-features = ["relay-tests"]

[dependencies]
# Already in the tree through iroh; the beacon (beacon.rs) uses them directly.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
blake3 = "1"
data-encoding = "2"
iroh = "1.3"
# Exact pin: the iroh-blobs wire format has no version negotiation (ADR 0001).
iroh-blobs = { version = "=0.103.0", features = ["fs-store"] }
# The Mainline DHT as an address lookup service (spec section 3).
iroh-mainline-address-lookup = "0.6"
# Only for the on-demand relay test (feature `relay-tests`): a relay server to run it against.
iroh-relay = { version = "1.3", optional = true, features = ["server"] }
n0-future = "0.3"
netwatch = "0.19"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
swarm-discovery = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
