[package]
name = "bhayanakshare-core"
description = "BhayanakShare core: Device API, control protocol, stores and persistence. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tests that run a relay server of their own, which most builds have no use for. Run one with
# `cargo test -p bhayanakshare-core --features relay-tests --test relay_limit`.
relay-tests = ["dep:iroh-relay"]

[[test]]
name = "relay_limit"
required-features = ["relay-tests"]

[dependencies]
# Already in the tree through iroh; the beacon (beacon.rs) uses them directly.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Derives the key that protects an identity export (identity_file.rs).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1"
data-encoding = "2"
iroh = "1.3"
# Exact pin: the iroh-blobs wire format has no version negotiation (ADR 0001).
iroh-blobs = { version = "=0.103.0", features = ["fs-store"] }
# The Mainline DHT as an address lookup service (spec section 3).
iroh-mainline-address-lookup = "0.6"
# The OS secret store (keystore.rs). The default `v1` feature picks Secret Service over pure-Rust
# zbus on Linux (no libdbus), Keychain on macOS and Credential Manager on Windows.
keyring = "4"
# Only for the on-demand relay test (feature `relay-tests`): a relay server to run it against.
iroh-relay = { version = "1.3", optional = true, features = ["server"] }
n0-future = "0.3"
netwatch = "0.19"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Already in the tree through tokio and swarm-discovery; the lookup responder (responder.rs)
# needs the socket options tokio does not expose: reusing the mDNS port and choosing the interface.
socket2 = { version = "0.6", features = ["all"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
swarm-discovery = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
# The rolling log file (logs.rs). It also deletes log files older than the last few.
tracing-appender = "0.2"
# Wipes secret key material when it is dropped.
zeroize = "1"
# The diagnostics export (logs.rs): a zip of the log files, deflated, and nothing else.
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# The privacy test (tests/log_privacy.rs) installs a subscriber that captures what is logged.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
